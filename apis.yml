aid: thoropass
name: Thoropass
description: >-
  Thoropass is an auditor-led, AI-powered compliance and audit automation platform
  that combines software with expert auditor services. Its products span continuous
  compliance monitoring and alerting, automated evidence collection, a global control
  library, vulnerability scanning, and CREST-accredited penetration testing, helping
  companies achieve and maintain SOC 2, ISO 27001, HIPAA, PCI DSS and HITRUST. For
  developers and integration partners, Thoropass exposes a Partner API secured with
  OAuth 2.0 (Authorization Code + PKCE, refresh tokens, and RFC 7591 dynamic client
  registration) and a hosted, OAuth-protected Model Context Protocol (MCP) server for
  AI-agent access to audits, evidence requests, controls, alerts, devices and
  vulnerability data. Thoropass (formerly Laika) is backed by Bain Capital Ventures.
